[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nptel-deep-learning-for-computer-vision"
version = "1.0.0"
description = "Modernized implementations and benchmarks for NPTEL Deep Learning for Computer Vision"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "NatalTiger" }
]
keywords = [
    "deep-learning",
    "computer-vision",
    "pytorch",
    "convolutional-neural-networks",
    "vision-transformer",
    "generative-adversarial-networks",
    "metric-learning",
    "interpretability",
    "self-supervised-learning"
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pillow>=9.5.0",
    "opencv-python>=4.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "nbformat>=5.9.0",
    "nbclient>=0.10.0",
    "ipykernel>=6.29.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501"]
